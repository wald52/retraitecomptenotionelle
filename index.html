<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retraite à comptes notionnels — simulateur</title>
<meta name="description" content="Simulateur d'un système de retraite français en comptes notionnels, appliqué rétroactivement depuis 1941. Le calcul s'exécute dans votre navigateur.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📈</text></svg>">

<!-- La feuille de style est extraite du module Python par
     scripts/construire_donnees.py : elle n'existe qu'en un seul endroit, celui
     où le modèle de référence décrit son propre rendu. -->
<link rel="stylesheet" href="moteur/style.css">
<link rel="preload" href="moteur/donnees.json" as="fetch" crossorigin>

<!-- Le portage est un graphe de modules profond de cinq niveaux : sans ces
     déclarations le navigateur ne découvre chaque niveau qu'après avoir reçu le
     précédent, soit cinq aller-retours avant que le modèle puisse tourner. Les
     annoncer tous ici les fait partir ensemble, dès la lecture de l'en-tête.
     La liste est verrouillée sur le contenu de moteur/js/ par un test. -->
<link rel="modulepreload" href="moteur/js/pages.js">
<link rel="modulepreload" href="moteur/js/simulateur.js">
<link rel="modulepreload" href="moteur/js/scenario-notionnel.js">
<link rel="modulepreload" href="moteur/js/age-reference.js">
<link rel="modulepreload" href="moteur/js/carriere.js">
<link rel="modulepreload" href="moteur/js/compte.js">
<link rel="modulepreload" href="moteur/js/conversion.js">
<link rel="modulepreload" href="moteur/js/fusion.js">
<link rel="modulepreload" href="moteur/js/gabarit.js">
<link rel="modulepreload" href="moteur/js/indexation.js">
<link rel="modulepreload" href="moteur/js/macro.js">
<link rel="modulepreload" href="moteur/js/mortalite.js">
<link rel="modulepreload" href="moteur/js/scenario-actuel.js">
<link rel="modulepreload" href="moteur/js/calendrier.js">
<link rel="modulepreload" href="moteur/js/castypes.js">
<link rel="modulepreload" href="moteur/js/config.js">
<link rel="modulepreload" href="moteur/js/format.js">
<link rel="modulepreload" href="moteur/js/regimes.js">
<link rel="modulepreload" href="moteur/js/serie.js">

<style>
  /* Écran d'attente. Il ne s'affiche qu'au-delà d'un tiers de seconde : sur une
     connexion rapide le simulateur est prêt avant, et un écran qui n'aurait
     clignoté que le temps d'être aperçu vaut moins que rien. Le retard est en
     CSS et non en JavaScript, parce que l'attente qu'il couvre se produit
     justement avant que le moindre script ne soit chargé. */
  #amorce { max-width: 34rem; margin: 0 auto; padding: 5rem 1.5rem; text-align: center;
            animation: paraitre 0.25s ease-out 0.35s both; }
  #amorce h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 0.75rem; }
  #amorce p { color: var(--texte-doux); font-size: 0.98rem; }
  #amorce .jauge { height: 6px; width: min(24rem, 80%); margin: 2rem auto 0;
                   background: var(--fond-appui); border-radius: 3px; overflow: hidden; }
  #amorce .jauge > span { display: block; height: 100%; width: 30%;
                          background: var(--accent);
                          animation: glisse 1.4s ease-in-out infinite; }
  @keyframes paraitre { from { opacity: 0; } to { opacity: 1; } }
  /* Lue par les synthèses vocales, jamais affichée : le contenu de <main> est
     remplacé en bloc à chaque calcul, ce qu'un lecteur d'écran ne signale pas
     de lui-même. */
  .hors-ecran { position: absolute; width: 1px; height: 1px; overflow: hidden;
                clip-path: inset(50%); white-space: nowrap; }
  .replique { text-align: left; border-left: 3px solid var(--accent);
              background: var(--fond-appui); padding: 0.9rem 1.1rem; margin-top: 1.5rem;
              font-size: 0.92rem; }
</style>
</head>
<body>

<p id="annonce" class="hors-ecran" role="status" aria-live="polite"></p>

<div id="amorce">
  <h1>Retraite à comptes notionnels</h1>
  <p>Le simulateur se prépare. Le modèle et les données de référence s'exécutent
  dans votre navigateur : rien n'est envoyé à un serveur, et il n'y a rien à
  installer.</p>
  <div class="jauge"><span></span></div>
  <noscript>
    <div class="replique">Ce simulateur a besoin de JavaScript : le calcul se fait
    dans votre navigateur, il n'y a pas de serveur pour le faire à sa place.</div>
  </noscript>
</div>

<script type="module">
import { Contexte, TITRES, rendre } from "./moteur/js/pages.js";
import * as gabarit from "./moteur/js/gabarit.js";

const amorce = document.getElementById("amorce");
let contexte = null;

function echec(titre, detail) {
  amorce.innerHTML = `<h1>${titre}</h1><div class="replique">${detail}</div>`;
}

// -- démarrage ---------------------------------------------------------------

async function preparer() {
  // Requête volontairement nue : c'est celle que décrit le <link rel="preload">
  // de l'en-tête, `crossorigin` compris. Toute option qui s'en écarterait ferait
  // manquer le préchargement, et le paquet serait téléchargé deux fois.
  const reponse = await fetch("moteur/donnees.json", { cache: "force-cache" });
  if (!reponse.ok) {
    throw new Error(`moteur/donnees.json introuvable (${reponse.status})`);
  }
  const paquet = await reponse.json();

  contexte = new Contexte(paquet);
  // Construit le simulateur du jeu de paramètres par défaut — séries, tables de
  // mortalité et catalogue des régimes. C'est la seule opération qui coûte, et
  // les simulations suivantes la réutilisent.
  contexte.simulateur();
}

// -- rendu -------------------------------------------------------------------

function coquille() {
  amorce.remove();
  // Le pied est posé une fois, à côté de <main> et non dedans : un <footer>
  // imbriqué dans <main> n'est pas un repère « contentinfo » et disparaît de la
  // navigation par repères. Il est statique, le reconstruire à chaque rendu ne
  // servait rien non plus.
  document.body.insertAdjacentHTML("beforeend",
    '<div id="entete"></div><main id="contenu"></main>' + gabarit.pied());
}

// Ce que la synthèse vocale doit entendre après un calcul. Le contenu de <main>
// est remplacé en bloc : sans cette annonce, valider le formulaire ne produit
// aucun retour audible, alors que c'est l'interaction centrale du site.
function annoncer(texte) {
  const region = document.getElementById("annonce");
  // Vider d'abord : deux calculs qui donnent le même texte doivent s'entendre
  // deux fois, et une région dont le contenu ne change pas reste muette.
  region.textContent = "";
  setTimeout(() => { region.textContent = texte; }, 50);
}

// Résumé parlé d'une page rendue : le refus de saisie s'il y en a un, sinon les
// scénarios chiffrés, sinon le seul titre.
function resume(titre, contenu) {
  const refus = contenu.querySelector(".erreur");
  if (refus) { return `${titre}. ${refus.textContent.trim()}`; }

  const scenarios = [...contenu.querySelectorAll(".scenario")].map((bloc) => {
    const nom = bloc.querySelector(".titre")?.textContent.trim();
    const mensuel = bloc.querySelector(".mensuel")?.textContent.trim();
    return nom && mensuel ? `${nom} : ${mensuel} par mois` : null;
  }).filter(Boolean);

  return scenarios.length
    ? `${titre}. ${scenarios.length} scénarios calculés. ${scenarios.join(". ")}.`
    : `${titre}.`;
}

function chargement(message) {
  return `<div class="chargement">${message}<div class="jauge"><span></span></div></div>`;
}

function adresse() {
  const brut = location.hash.replace(/^#/, "") || "/";
  const separation = brut.indexOf("?");
  const chemin = separation === -1 ? brut : brut.slice(0, separation);
  const requete = separation === -1 ? "" : brut.slice(separation + 1);
  const parametres = {};
  new URLSearchParams(requete).forEach((valeur, cle) => { parametres[cle] = valeur; });
  return { chemin: chemin || "/", parametres };
}

// Les options de modélisation restent ouvertes d'une simulation à l'autre :
// qui les a dépliées une fois y revient.
let optionsDepliees = false;

async function afficher() {
  const cible = adresse();
  const contenu = document.getElementById("contenu");
  const details = contenu.querySelector("form details");
  if (details) { optionsDepliees = details.open; }

  document.body.classList.add("calcul-en-cours");
  contenu.innerHTML = chargement(
    cible.chemin === "/cas-types"
      ? "Calcul des 12 cas types sur 7 générations…"
      : "Calcul en cours…",
  );
  // Laisse le navigateur peindre l'attente avant de bloquer sur le calcul.
  await new Promise((suite) => { setTimeout(suite, 20); });

  let titre;
  let corps;
  try {
    [titre, corps] = rendre(contexte, cible.chemin in TITRES ? cible.chemin : "/",
      cible.parametres);
  } catch (erreur) {
    document.body.classList.remove("calcul-en-cours");
    contenu.innerHTML = '<div class="erreur"><strong>Le calcul a échoué.</strong> '
      + String(erreur).replace(/[<>&]/g, "") + "</div>";
    annoncer(`Le calcul a échoué. ${String(erreur).replace(/[<>&]/g, "")}`);
    return;
  }

  document.getElementById("entete").innerHTML = gabarit.entete(cible.chemin);
  contenu.innerHTML = corps;
  document.title = `${titre} — Retraite en comptes notionnels`;
  document.body.classList.remove("calcul-en-cours");
  annoncer(resume(titre, contenu));

  const nouveauDetails = contenu.querySelector("form details");
  if (nouveauDetails && optionsDepliees) { nouveauDetails.open = true; }
  window.scrollTo({ top: 0 });
}

// -- navigation --------------------------------------------------------------

document.addEventListener("submit", (evenement) => {
  const formulaire = evenement.target.closest("form");
  if (!formulaire) { return; }
  evenement.preventDefault();

  const parametres = new URLSearchParams();
  new FormData(formulaire).forEach((valeur, cle) => {
    if (String(valeur).trim() !== "") { parametres.set(cle, valeur); }
  });
  const cible = `#/?${parametres.toString()}`;
  if (location.hash === cible) { afficher(); } else { location.hash = cible; }
});

window.addEventListener("hashchange", afficher);

preparer().then(() => {
  coquille();
  return afficher();
}).catch((erreur) => {
  echec(
    "Le simulateur n'a pas pu se charger",
    `<p>${String(erreur)}</p>`
    + "<p>Le modèle et ses données sont servis depuis ce dépôt : un réseau "
    + "coupé pendant le chargement, ou un navigateur qui bloque les modules "
    + "JavaScript, peuvent l'empêcher d'aboutir. Recharger la page suffit "
    + "souvent ; sinon, un navigateur à jour (Firefox, Chrome, Safari, Edge) "
    + "règle le problème.</p>"
    + '<p><a href="https://github.com/wald52/retraitecomptenotionelle">'
    + "Le dépôt du projet</a></p>",
  );
});
</script>
</body>
</html>
