name: Publier le site

# Publie docs/ sur GitHub Pages à chaque poussée sur main. La première
# exécution active Pages elle-même (configure-pages, enablement) : il n'y a
# aucun réglage à faire à la main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Le paquet servi au navigateur doit refléter le code du dépôt : on
      # refuse de publier un site périmé.
      - name: Vérifier le paquet du simulateur
        run: python3 scripts/construire_site.py --verifier

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploiement
        uses: actions/deploy-pages@v4
