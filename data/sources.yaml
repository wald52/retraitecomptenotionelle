# Manifeste des sources institutionnelles
# ---------------------------------------
# Chaque jeu de données du dépôt référence une entrée de ce manifeste via son
# champ `source_id`. Le manifeste est la seule autorité sur « d'où vient ce
# chiffre ». Aucune donnée ne doit entrer dans data/reference/ sans y figurer.
#
# Champ `acces` :
#   api      -> récupérable automatiquement (voir scripts/fetch/)
#   fichier  -> fichier téléchargeable (xls/csv/pdf) à déposer dans data/brut/
#   document -> publication (rapport, JO, décret) à saisir manuellement
#
# Champ `statut_integration` :
#   certifie   -> data/reference/ est recontrôlé contre la source par
#                 scripts/verifier_donnees.py, qui appose le niveau `certifiee`
#   automatise -> data/reference/ est régénéré par un script
#   saisi      -> valeurs saisies à la main depuis la source, à certifier
#   a_faire    -> source identifiée, données pas encore intégrées
#
# Champ `idbank` : identifiant de série dans la Banque de données
# macroéconomiques de l'INSEE, interrogeable sans clé d'accès à l'adresse
# https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/<idbank>
#
# QUELLE SOURCE L'EMPORTE, QUAND DEUX SE DISPUTENT UNE VALEUR
# ============================================================
# Le manifeste dit d'où vient chaque chiffre ; ces quatre critères disent
# laquelle des sources disponibles il faut aller chercher. Ils s'appliquent
# dans l'ordre, et le premier qui départage tranche. Ce n'est pas un classement
# d'institutions : c'est un classement de NATURES de données. La même
# institution est primaire sur un terrain et secondaire sur l'autre.
#
# 1. LE PRODUCTEUR PRIME SUR LE REPRENEUR.
#    On remonte d'un cran chaque fois qu'on le peut : l'INSEE plutôt qu'un
#    rapport qui cite l'INSEE, la caisse plutôt que la synthèse qui la
#    transcrit. C'est le critère qui gouverne le niveau de fiabilité, et il est
#    déjà appliqué par scripts/verifier_donnees.py : `certifiee` suppose que la
#    source soit le producteur de la donnée. Une transcription tierce, même
#    sourcée et reprise automatiquement, plafonne à `haute`.
#    La raison n'est pas cosmétique : le critère dit ce qu'un lecteur saurait
#    vérifier lui-même en remontant d'un cran.
#
# 2. L'OBSERVÉ PRIME SUR LE PROJETÉ.
#    Une série mesurée bat une hypothèse, toujours, y compris quand
#    l'hypothèse est plus récente et mieux présentée. Une projection n'entre
#    dans data/reference/ que là où l'observation manque, et elle y entre au
#    niveau `estimee`, qui se propage jusqu'au résultat affiché.
#
# 3. LE MONTANT SERVI PRIME SUR LE MONTANT CALCULÉ.
#    Quand une caisse publie ce qu'elle a réellement payé, ce chiffre l'emporte
#    sur toute reconstitution, fût-elle fidèle au texte. Le minimum contributif
#    et le minimum garanti en vivent : la revalorisation légale à laquelle
#    leurs articles renvoient a été gelée puis sous-indexée, si bien que le
#    calcul dépasse de plusieurs points ce qui a été versé.
#
# 4. LE RECONTRÔLABLE PRIME SUR LE SAISI.
#    À qualité de source égale, on préfère ce qu'un script peut reconfronter
#    chaque année (`acces: api`) à ce qu'il faut ressaisir à la main
#    (`acces: document`). Une saisie est juste le jour où elle est faite ; une
#    récupération automatisée le reste.
#
# CE QUE LES QUATRE CRITÈRES DONNENT, EN CLAIR
# ---------------------------------------------
# L'INSEE pour ce qu'il MESURE — prix, salaires, productivité, comptes
# nationaux, espérances de vie, projections de population. Le COR pour ce qu'il
# DÉCIDE — les hypothèses de long terme, dont il est l'auteur et non le
# repreneur, et la description consolidée des régimes que personne d'autre ne
# publie. Jamais le COR comme intermédiaire vers une donnée INSEE : ses
# rapports tabulent commodément les projections démographiques de l'INSEE, les
# recopier de là ferait perdre un cran de fiabilité sans rien gagner.
#
# Le même raisonnement vaut ailleurs : OpenFisca est un repreneur remarquable
# et plafonne pourtant à `haute` ; Légifrance est le producteur du droit et
# porte donc des valeurs certifiées ; une caisse est primaire sur son propre
# barème et secondaire sur la macroéconomie.
#
# QUAND LES CRITÈRES NE TRANCHENT PAS
# ------------------------------------
# Il reste des valeurs dont personne n'est producteur : les hypothèses de
# projection, et les régimes anciens dont l'historique n'a jamais été publié
# ailleurs que dans une synthèse. Elles entrent quand même — un modèle qui
# refuserait de projeter ne calculerait rien — mais au niveau que leur nature
# impose, `estimee` ou `moyenne`, et en nommant le millésime de la publication
# d'où elles sortent. Le champ `note` de l'entrée sert à ça.

version_manifeste: "2026-09-05"

institutions:

  insee:
    nom: Institut national de la statistique et des études économiques
    role: >-
      Indice des prix à la consommation, salaire moyen par tête, productivité,
      comptes nationaux, tables de mortalité et projections démographiques.
    jeux:
      - id: insee_bdm_ipc
        titre: Indice annuel des prix à la consommation, ensemble, 1949-2025
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/000008965
        idbank: ["000008965", "001764363"]
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/ipc_annuel.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          Deux bases chaînées : base 100 en 1980 (publiée de 1949 à 1992) puis
          base 2015 (à partir de 1990), raccordées sur 1990. L'API Melodi
          (DS_IPC_PRINC) ne remonte pas avant les années 1990 ; la BDM, si.

      - id: insee_ipc_long
        titre: Indice des prix à la consommation depuis 1901
        url: https://www.insee.fr/fr/information/2417794
        acces: fichier
        statut_integration: saisi
        cible: data/reference/macro/ipc_annuel.csv
        note: >-
          Seule source pour 1930-1949, que la BDM ne couvre pas. Tableau à
          télécharger et convertisseur franc/euro, à saisir à la main.

      - id: insee_ipc_melodi
        titre: Indice des prix à la consommation (jeu principal)
        url: https://api.insee.fr/melodi/data/DS_IPC_PRINC
        acces: api
        statut_integration: automatise
        cible: data/brut/insee_ipc_melodi.json
        note: Utilisé pour vérifier la partie récente de la série longue.

      - id: insee_bdm_smpt
        titre: Salaire moyen par tête, comptes nationaux annuels base 2020
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/011785411
        idbank: ["011785411", "011793486"]
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/salaire_moyen.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          Salaires et traitements bruts (D11, total des branches) rapportés à
          l'emploi salarié intérieur en personnes physiques — la définition du
          SMPT dans les comptes nationaux. Disponible depuis 1949.

      - id: insee_bdm_masse_salariale
        titre: Masse salariale (D11), comptes nationaux annuels base 2020
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/011785411
        idbank: ["011785411"]
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/masse_salariale.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          Le même agrégat que le numérateur du salaire moyen par tête, mais pris
          EN NIVEAU : salaires et traitements bruts du total des branches, en
          euros courants, disponibles depuis 1949. C'est l'assiette des
          cotisations, donc le taux de rendement qu'un système en répartition
          peut servir sans changer son taux de cotisation. L'écart avec le SMPT
          est exactement la croissance de l'emploi salarié.

      - id: insee_bdm_pib
        titre: Produit intérieur brut, prix courant, comptes nationaux base 2020
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/011779992
        idbank: ["011779992"]
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/pib_nominal.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          PIB approche produit, en euros courants, disponible depuis 1949.
          Assiette la plus large qu'un système de retraite puisse viser : elle
          capte le déplacement de la valeur ajoutée vers les revenus non
          salariaux, que la masse salariale subit. Sert la variante « à
          l'italienne » de l'indexation, dont le lissage sur cinq ans est
          appliqué par le moteur et non par la série.

      - id: insee_bdm_productivite
        titre: Productivité du travail par tête, comptes nationaux base 2020
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/011785223
        idbank: ["011785223", "011793334", "011793337"]
        acces: api
        statut_integration: certifie
        cible: data/reference/macro/productivite.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          Valeur ajoutée en volume (prix chaînés de 2020) rapportée à l'emploi
          intérieur total en personnes physiques. L'idbank 011793337 donne la
          variante horaire, pour le paramètre indicateur_productivite.

      - id: insee_bdm_esperance_vie
        titre: Espérances de vie à la naissance et à 60 ans, 1946-2025
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/001686950
        idbank: ["001686946", "001686951", "001686950", "001686955"]
        acces: api
        statut_integration: certifie
        cible: data/reference/mortalite/esperances_vie.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          France métropolitaine, par sexe, annuel. L'INSEE ne publie pas
          l'espérance de vie à 65 ans, à aucune période : voir ocde_health_le.

      - id: insee_bdm_point_complementaire
        titre: Valeur de service du point Agirc, Arrco et Agirc-Arrco, 2001-
        url: https://api.insee.fr/series/BDM/V1/data/SERIES_BDM/010593202
        idbank: ["000849395", "000822495", "010593202"]
        acces: api
        statut_integration: certifie
        cible: data/reference/regimes/valeurs_point.csv
        recuperation: scripts/fetch/insee_bdm.py
        note: >-
          Séries mensuelles ; le dépôt retient l'observation de décembre, sa
          convention étant la valeur en vigueur au 31 décembre. L'INSEE n'est
          pas le producteur de ces barèmes — l'Agirc-Arrco l'est — donc ces
          valeurs ne priment pas sur la transcription d'OpenFisca, seule à
          couvrir l'avant-2001 : elles la recoupent, et les 42 années communes
          concordent sans exception. Elles la prolongent en revanche là où elle
          s'arrête, l'INSEE publiant encore après la dernière année d'OpenFisca.

      - id: insee_deces_mortalite
        titre: Décès et mortalité — séries longues
        url: https://api.insee.fr/melodi/data/DS_DECES_MORTALITE_SERIES
        acces: api
        statut_integration: automatise
        cible: data/brut/insee_mortalite_series.json

      - id: insee_tables_mortalite
        titre: Tables de mortalité du moment (TD/TV) et tables par génération
        url: https://www.insee.fr/fr/statistiques/5390366
        complement_url: https://www.insee.fr/fr/statistiques/fichier/2416631/
        acces: fichier
        statut_integration: a_faire
        cible: data/reference/mortalite/quotients_periode.csv
        note: >-
          Seule source de quotients par âge antérieurs à 1986, et seule à
          couvrir les grands âges. Diffusée en tableurs seulement : ni la BDM
          ni Melodi ne l'exposent. Pour 1986-2024, la table vient d'Eurostat
          (eurostat_mlifetable).

      - id: insee_projections_mortalite
        titre: >-
          Projections de population 2026 — hypothèses de mortalité jusqu'en 2125
        url: https://www.insee.fr/fr/statistiques/8990899
        acces: fichier
        statut_integration: automatise
        cible: data/reference/mortalite/esperances_vie.csv
        recuperation: scripts/fetch/insee_projections_mortalite.py
        millesime: 2026
        note: >-
          Quotients de mortalité par âge (0 à 120 ans) et par année (2023 à
          2125), pour les hypothèses d'espérance de vie centrale, basse et
          haute. Le dépôt reprend la centrale et en DÉRIVE e0, e60 et e65 de
          2026 à 2125 — dont e65, que l'INSEE ne publie jamais. Les années 2023
          à 2025 sont ignorées : elles sont observées, et l'observé prime sur le
          projeté même quand les deux viennent du même producteur. La somme des
          survies se fait sans le demi-an usuel, ce classeur indexant ses
          quotients par âge atteint dans l'année ; le récupérateur contrôle la
          convention contre l'espérance de vie à la naissance que l'INSEE
          publie pour 2070 (89,5 et 86,7 ans) et échoue si elle casse. Remplace
          l'exercice 2021-2070, dont six valeurs étaient saisies aux années
          rondes et une, 2080, dépassait l'horizon.

  cor:
    nom: Conseil d'orientation des retraites
    role: >-
      Projections du système de retraite, cas types, paramètres historiques
      par régime, taux de remplacement, rendements.
    jeux:
      - id: cor_rapport_annuel
        titre: Rapport annuel du COR — évolutions et perspectives des retraites
        url: https://www.cor-retraites.fr/documents-rapports
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/*.yaml
      - id: cor_hypotheses_projection
        titre: >-
          Hypothèses économiques de long terme du COR — scénario de référence et
          variantes de productivité
        url: https://www.cor-retraites.fr/sites/default/files/2026-06/Intro%20RA.pdf
        acces: document
        statut_integration: saisi
        cible: data/reference/macro/hypotheses_projection.yaml
        millesime: juin 2026
        note: >-
          Le jeu de scénarios du dépôt transcrit celui du COR : référence à
          0,7 % de croissance annuelle de la productivité horaire du travail,
          variantes à 0,4 % et 1,0 %. Ce jeu apparaît dans le rapport de juin
          2025 — qui abandonne explicitement la variante à 1,3 % — et est
          reconduit à l'identique en juin 2026. Trois écarts assumés avec la
          source, détaillés dans le fichier cible : productivité par tête et
          non horaire, cible atteinte dès 2026 et non en 2040, emploi salarié
          supposé constant. L'inflation de long terme à 1,75 % est une
          convention reconduite des rapports antérieurs : les documents publics
          de juin 2025 et juin 2026 ne la restatent pas.
      - id: cor_cas_types
        titre: Cas types du COR (carrières de référence)
        url: https://www.cor-retraites.fr/simulateurs
        acces: document
        statut_integration: saisi
        cible: data/reference/legislation/cas_types.yaml
      - id: cor_panorama_regimes
        titre: Panorama des régimes de retraite français (fiches thématiques)
        url: https://www.cor-retraites.fr/fiches-reperes
        acces: document
        statut_integration: saisi

  csr:
    nom: Comité de suivi des retraites
    role: Avis annuels sur le pilotage, indicateurs de suivi.
    jeux:
      - id: csr_avis_annuel
        titre: Avis annuel du Comité de suivi des retraites
        url: https://www.strategie.gouv.fr/comite-de-suivi-des-retraites
        acces: document
        statut_integration: a_faire

  drees:
    nom: Direction de la recherche, des études, de l'évaluation et des statistiques
    role: >-
      Panorama « Les retraités et les retraites », EIR/EIC, modèle TRAJECTOiRE,
      effectifs et montants de pensions par régime.
    jeux:
      - id: drees_panorama_retraites
        titre: Les retraités et les retraites (édition annuelle)
        url: https://drees.solidarites-sante.gouv.fr/publications-communique-de-presse/panoramas-de-la-drees/les-retraites-et-les-retraites
        acces: fichier
        statut_integration: saisi
        cible: data/reference/regimes/effectifs_retraites.csv
      - id: drees_open_data
        titre: Portail open data DREES
        url: https://data.drees.solidarites-sante.gouv.fr/
        acces: api
        statut_integration: a_faire
      - id: drees_eic
        titre: Échantillon interrégimes de cotisants (EIC)
        url: https://drees.solidarites-sante.gouv.fr/sources-outils-et-enquetes/lechantillon-interregimes-de-cotisants-eic
        acces: document
        statut_integration: a_faire
        note: >-
          Source de référence pour les carrières individuelles rétrospectives.
          Accès sous convention (CASD) — non redistribuable dans ce dépôt.

  cnav:
    nom: Caisse nationale d'assurance vieillesse
    role: Régime général — paramètres, barèmes, statistiques.
    jeux:
      - id: cnav_montants_minimum
        titre: Montants servis du minimum contributif et du plafond, 2024-2026
        url: https://www.legislation.lassuranceretraite.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/legislation/minimum_contributif.csv
        note: >-
          Montants mensuels en vigueur au 31 décembre de chaque année, tels que
          publiés et relayés : 733,03 € puis 747,69 € et 756,29 € pour le
          minimum, 876,13 € puis 893,39 € et 903,93 € pour le majoré, plafond
          d'écrêtement 1 394,86 € puis 1 444,89 €. Transcription, donc `haute`
          et jamais `certifiee` — mais préférée à une projection, parce qu'elle
          dit ce qui a été payé. Le montant de 2023 n'est pas repris ici : le
          code le porte déjà, au centime près.

      - id: cnav_revalorisation_salaires
        titre: Coefficients de revalorisation des salaires portés au compte, dix colonnes 2017-2026
        url: https://legislation.lassuranceretraite.fr/Pdf/circulaire_cnav_2025_29_22122025.pdf
        acces: document
        statut_integration: automatise
        cible: data/reference/legislation/revalorisation_salaires.csv
        recuperation: scripts/fetch/cnav_revalorisation_salaires.py
        note: >-
          Le salaire annuel moyen du régime général est la moyenne des N
          MEILLEURES années, et « meilleures » se juge sur des salaires
          REVALORISÉS : ces coefficients commandent donc à la fois le montant
          retenu et le CHOIX des années. La circulaire annuelle de revalorisation
          les publie en entier, une ligne par année de perception — c'est la
          caisse qui les applique qui les publie.
          Le modèle les approchait par « les salaires jusqu'en 1986, les prix
          depuis », ce qui SUR-revalorise les salaires anciens de 12,1 % sur
          1970-2018 et de 13,6 % sur 1980-2018.
          Le dépôt a d'abord repris la table cumulée d'OpenFisca-France-Pension,
          faute d'avoir cherché plus haut. Confrontée à la circulaire du
          9 janvier 2023, elle s'en écarte de −3 % à −5,5 % sur toutes les
          perceptions postérieures à 1990 — il lui manque la revalorisation
          exceptionnelle de 4 % du 1er juillet 2022 — et de −17 % à +10 %, sans
          régularité, sur les années 1949-1962. Une seconde implémentation est
          une contre-expertise, pas une source.
          DIX COLONNES sont conservées, d'octobre 2017 à janvier 2026. Le
          coefficient entre deux années se lit dans une colonne, par rapport de
          deux de ses valeurs, parce que l'arrêté annuel applique un coefficient
          unique à tous les salaires déjà portés au compte. Une colonne
          suffirait donc en théorie ; en pratique la caisse arrondit sa table à
          trois décimales et repart chaque année de la précédente, si bien que
          la reconstruction dérive avec la distance — 0,02 % à deux ans, 0,16 %
          à sept. Le modèle sert donc la colonne de l'année quand elle existe et
          ancre sinon sur la plus proche, ce qui divise la dérive par dix.
          Les colonnes dont la date d'effet n'est pas le 1er janvier — octobre
          2017, juillet 2022 — ne sont jamais servies telles quelles : le modèle
          raisonne à l'année. Elles restent des ancres, leur date s'annulant
          dans le rapport.
          Le récupérateur recoupe chaque colonne contre chacune des autres à
          chaque exécution et refuse d'écrire si l'une s'écarte de plus de 1 % ;
          il refuse aussi une circulaire qui se déclare annulée et remplacée —
          la 2020-5 l'est par la 2020-9. Les colonnes sont figées dans
          tests/temoins/cnav_revalorisation_salaires.json, et deux tests les
          opposent au modèle.
          Fiabilité `haute`, jamais `certifiee` : la circulaire est la
          publication de la caisse, non le Journal officiel — elle transcrit
          l'arrêté et l'instruction interministérielle qu'elle cite.
          Hors de la plage — perceptions antérieures à 1930, liquidations
          postérieures à la dernière colonne — le modèle ancre sur la borne
          connue et prolonge par son approximation. Avant 2017, aucune
          circulaire n'est accessible en ligne : la dérive de la reconstruction
          y est invérifiable.

      - id: cnav_baremes
        titre: Barèmes et paramètres du régime général (circulaires)
        url: https://www.legislation.cnav.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/regime_general.yaml
      - id: cnav_statistiques
        titre: Statistiques et open data CNAV
        url: https://www.statistiques-recherches.cnav.fr/
        acces: fichier
        statut_integration: a_faire

  sre:
    nom: Service des retraites de l'État
    role: Fonction publique d'État — pensions civiles et militaires.
    jeux:
      - id: sre_rapport_annuel
        titre: Rapport annuel du Service des retraites de l'État
        url: https://retraitesdeletat.gouv.fr/
        acces: document
        statut_integration: saisi
        cible: data/reference/regimes/fonction_publique_etat.yaml

      - id: sre_historique_taux
        titre: Historique des taux de cotisations appelés par le CAS « Pensions »
        url: https://retraitesdeletat.gouv.fr/files/files/Professionnels/CAS/Fiches/Historique%20taux%20cotisations.pdf
        acces: api
        statut_integration: certifie
        cible: data/reference/legislation/contribution_employeur_public.csv
        recuperation: scripts/fetch/contribution_employeur_public.py
        note: >-
          La fiche du SERVICE QUI APPELLE la cotisation : quatorze colonnes, une
          par situation d'emploi, du 1er janvier 2006 au 1er janvier 2026. Le
          modèle en retient la contribution employeur de l'État pour un agent
          civil — 49,90 % en 2006, 74,28 % de 2013 à 2024, 78,28 % en 2025,
          82,28 % en 2026 (décret n° 2025-1341 du 26 décembre 2025). Source
          primaire, donc certifiable ; le récupérateur la recoupe en outre
          contre la transcription OpenFisca des mêmes décrets. Les taux
          militaires (126,07 %) et ceux des employeurs d'accueil ne sont pas
          repris : le modèle ne distingue pas les corps.

      - id: sre_minimum_garanti
        titre: Montant du minimum garanti, article L. 17 du code des pensions
        url: https://retraitesdeletat.gouv.fr/actif/le-calcul-de-ma-retraite/le-minimum-garanti
        acces: document
        statut_integration: saisi
        cible: data/reference/legislation/minimum_garanti_montants.csv
        note: >-
          Le montant PLEIN du minimum garanti, celui d'une carrière de quarante
          ans de services : 997,96 € par mois au 1er janvier 2004, date à
          laquelle l'article gèle sa référence, puis 1 174,33 € en 2020,
          1 248,33 € en 2023, 1 325,01 € en 2024 et 1 354,16 € en 2025. Ces
          montants SERVIS priment sur toute projection, comme ceux du minimum
          contributif et pour la même raison : la revalorisation des pensions à
          laquelle renvoie l'article a été gelée en 2014 et sous-indexée
          depuis, si bien qu'une projection sur les prix dépasse de 4,6 % ce qui
          a été payé en 2024. Transcriptions de publications, non confrontées à
          un fichier du producteur : niveau `haute`.

