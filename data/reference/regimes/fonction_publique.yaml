# Régimes de la fonction publique, 1853 -> aujourd'hui
regimes:

  - code: pensions_civiles_1853
    nom: Régime des pensions civiles et militaires (loi du 9 juin 1853)
    famille: fonction_publique
    source_id: legifrance_textes
    fiabilite: estimee
    creation: 1853
    fermeture: 1948
    extinction: 1948
    succede_a: []
    integre_dans: fonction_publique_etat
    population: Fonctionnaires civils et militaires de l'État.
    hors_repartition: false
    periodes:
      - debut: 1930
        fin: 1948
        type_calcul: annuites
        age_ouverture: 60
        age_taux_plein: 60
        duree_requise_trimestres: 120
        taux_plein: 0.60
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.06
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [bonifications, categorie_active, reversion]
        notes: >-
          Antérieur à la répartition généralisée, mais versé sur crédits
          budgétaires courants : fonctionnellement en répartition dès l'origine.
          Retenue pour pension de 5 % puis 6 %. Catalogué à partir de 1930 pour
          couvrir les carrières entrant dans le champ du modèle.

  - code: fonction_publique_etat
    nom: Régime des pensions civiles et militaires de retraite (Service des retraites de l'État)
    famille: fonction_publique
    source_id: sre_rapport_annuel
    fiabilite: moyenne
    creation: 1948
    fermeture: null
    extinction: null
    succede_a: [pensions_civiles_1853]
    integre_dans: null
    population: Fonctionnaires titulaires de l'État, magistrats, militaires.
    hors_repartition: false
    periodes:
      - debut: 1948
        fin: 1963
        type_calcul: annuites
        age_ouverture: 60
        age_taux_plein: 60
        duree_requise_trimestres: 150
        taux_plein: 0.75
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.06
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [bonifications, categorie_active, majoration_enfants, reversion]
        notes: >-
          Loi du 20 septembre 1948 : 2 % par annuité, 37,5 annuités, 75 % du
          traitement des six derniers mois. Catégorie active : ouverture à
          55 ans, voire 50 ans pour les emplois « super-actifs ».
      - debut: 1964
        fin: 2003
        type_calcul: annuites
        age_ouverture: 60
        age_taux_plein: 60
        duree_requise_trimestres: 150
        taux_plein: 0.75
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.07
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [bonifications, categorie_active, majoration_enfants, reversion]
        notes: >-
          Code des pensions civiles et militaires de retraite (loi du 26 décembre
          1964). Retenue pour pension 6 % puis 7,85 %. Aucune décote :
          la seule sanction d'une carrière courte est la proratisation.
      - debut: 2004
        fin: 2010
        type_calcul: annuites
        age_ouverture: 60
        age_taux_plein: 65
        duree_requise_trimestres: 160
        duree_requise_par_generation: true
        taux_plein: 0.75
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.0785
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: 0.0075
        avantages_non_contributifs:
          [bonifications, categorie_active, majoration_enfants, reversion, minimum_garanti]
        notes: >-
          Loi Fillon de 2003 : alignement de la durée sur le privé, création
          d'une décote et d'une surcote dans la fonction publique, création du
          RAFP sur les primes.
      - debut: 2011
        fin: 2022
        type_calcul: annuites
        age_ouverture: 62
        age_taux_plein: 67
        duree_requise_trimestres: 172
        duree_requise_par_generation: true
        taux_plein: 0.75
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.1029
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: 0.0125
        avantages_non_contributifs:
          [bonifications, categorie_active, majoration_enfants, reversion, minimum_garanti]
        notes: >-
          Loi de 2010 : alignement progressif de la retenue pour pension sur le
          taux du privé (7,85 % -> 11,10 % en 2020), report des âges de 2 ans,
          y compris pour les catégories actives (55 -> 57, 50 -> 52).
      - debut: 2023
        fin: null
        type_calcul: annuites
        age_ouverture: 64
        age_taux_plein: 67
        duree_requise_trimestres: 172
        duree_requise_par_generation: true
        taux_plein: 0.75
        salaire_reference: derniers_6_mois
        assiette: hors_primes
        taux_cotisation_retraite: 0.1110
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: 0.0125
        avantages_non_contributifs:
          [bonifications, categorie_active, majoration_enfants, reversion, minimum_garanti]
        notes: >-
          Loi du 14 avril 2023 : catégories actives portées de 57 à 59 ans et de
          52 à 54 ans. Retenue salariale 11,10 % ; contribution employeur de
          l'État 74,28 % (civils) — cette contribution est un taux d'équilibre
          budgétaire et non un taux de droits : voir
          `traitement_contribution_employeur_etat` dans la configuration.

