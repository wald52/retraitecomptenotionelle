  - code: rafp
    nom: Retraite additionnelle de la fonction publique (ERAFP)
    famille: additionnel_capitalise
    source_id: erafp_parametres
    fiabilite: haute
    creation: 2005
    fermeture: null
    extinction: null
    succede_a: []
    integre_dans: null
    population: Ensemble des fonctionnaires des trois versants.
    hors_repartition: true
    periodes:
      - debut: 2005
        fin: null
        type_calcul: points
        age_ouverture: 62
        age_taux_plein: 62
        duree_requise_trimestres: null
        taux_plein: 1.0
        salaire_reference: carriere_entiere
        assiette: primes_uniquement
        taux_cotisation_retraite: 0.10
        part_salariale: 0.50   # décret 2004-569 : 5 % agent, 5 % employeur
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [reversion]
        notes: >-
          RÉGIME PAR CAPITALISATION PROVISIONNÉE — EXCLU DU PÉRIMÈTRE NOTIONNEL.
          5 % agent + 5 % employeur sur les primes, dans la limite de 20 % du
          traitement indiciaire. Conformément à la demande, les droits RAFP sont
          isolés dans un compartiment de capitalisation distinct et ne sont pas
          convertis en capital notionnel (cf. moteur/compartiments.py).
