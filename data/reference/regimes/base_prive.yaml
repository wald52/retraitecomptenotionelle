        type_calcul: annuites
        age_ouverture: 60
        age_ouverture_par_generation: true
        age_taux_plein: 65
        duree_requise_trimestres: 160
        duree_requise_par_generation: true
        taux_plein: 0.50
        age_taux_plein_par_generation: true
        decote_par_generation: true
        salaire_reference_par_generation: true
        duree_proratisation_par_generation: true
        salaire_reference: 25_meilleures_annees
        assiette: plafonnee
        taux_cotisation_retraite: 0.1475   # part PLAFONNÉE seule, moyenne OpenFisca sur la période
        taux_cotisation_deplafonnee: 0.0160   # prélevée sur la TOTALITÉ du salaire, n'ouvre aucun droit
        part_salariale_deplafonnee: 0.0000
        part_salariale: 0.4441   # du taux plafonné
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: null
        avantages_non_contributifs:
          [minimum_contributif, minimum_vieillesse, majoration_enfants, mda,
           avpf, reversion, periodes_assimilees]
        notes: >-
          Réforme Balladur (loi du 22 juillet 1993) : montée en charge de 150 à
          160 trimestres et de 10 à 25 meilleures années entre 1994 et 2008
          selon la génération ; indexation des salaires portés au compte et des
          pensions sur les prix. La durée indiquée est la cible ; la montée en
          charge par génération est portée par legislation/duree_requise.csv.

      - debut: 2004
        fin: 2008
        type_calcul: annuites
        age_ouverture: 60
        age_ouverture_par_generation: true
        age_taux_plein: 65
        duree_requise_trimestres: 164
        duree_requise_par_generation: true
        taux_plein: 0.50
        age_taux_plein_par_generation: true
        decote_par_generation: true
