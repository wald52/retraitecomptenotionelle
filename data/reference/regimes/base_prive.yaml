      - debut: 2009
        fin: 2010
        type_calcul: annuites
        age_ouverture: 60
        age_ouverture_par_generation: true
        age_taux_plein: 65
        duree_requise_trimestres: 164
        duree_requise_par_generation: true
        taux_plein: 0.50
        age_taux_plein_par_generation: true
        decote_par_generation: true
        salaire_reference_par_generation: true
        duree_proratisation_par_generation: true
        salaire_reference: 25_meilleures_annees
        assiette: plafonnee
        taux_cotisation_retraite: 0.1495   # part PLAFONNÉE seule, moyenne OpenFisca sur la période
        taux_cotisation_deplafonnee: 0.0170   # prélevée sur la TOTALITÉ du salaire, n'ouvre aucun droit
        part_salariale_deplafonnee: 0.0588
        part_salariale: 0.4448   # du taux plafonné
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: 0.0125
        avantages_non_contributifs:
