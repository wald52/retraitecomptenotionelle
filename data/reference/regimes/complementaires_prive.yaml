# Régimes complémentaires des salariés, 1947 -> aujourd'hui
regimes:

  - code: agirc
    nom: Association générale des institutions de retraite des cadres
    famille: complementaire_prive
    source_id: agirc_arrco_points
    fiabilite: moyenne
    creation: 1947
    fermeture: 2018
    extinction: 2018
    succede_a: []
    integre_dans: agirc_arrco
    population: Cadres et assimilés, sur la part de rémunération au-dessus du plafond.
    hors_repartition: false
    periodes:
      - debut: 1947
        fin: 1980
        type_calcul: points
        age_ouverture: 60
        age_taux_plein: 65
        duree_requise_trimestres: null
        taux_plein: 1.0
        abattement_points: agirc_arrco
        plafond_majoration_enfants: 2367
        plafond_majoration_annee: 2025
        salaire_reference: carriere_entiere
        assiette: tranche_b
        taux_cotisation_retraite: 0.08
        decote_par_trimestre: 0.01
        surcote_par_trimestre: null
        avantages_non_contributifs: [majoration_enfants, reversion, garantie_minimale_points]
        notes: >-
          Convention collective nationale du 14 mars 1947. Régime par points sur
          les tranches B et C. Taux contractuel monté progressivement de 8 % à
          16 % ; la garantie minimale de points (GMP) n'existe pas encore : elle
          est créée par l'accord du 9 février 1988, applicable au 1er janvier
          1989, d'où la coupure de période à cette date.
          Le taux de 8 % est celui du taux contractuel d'origine. OpenFisca ne
          transcrit les taux effectifs de l'Agirc qu'à partir de 1981 : ces
          trente-quatre années restent hors de portée d'un recoupement, et la
          période a été coupée à 1981 pour que celles qui suivent le soient.

      - debut: 1981
        fin: 1988
        type_calcul: points
        age_ouverture: 60
        age_taux_plein: 65
        duree_requise_trimestres: null
        taux_plein: 1.0
        abattement_points: agirc_arrco
        plafond_majoration_enfants: 2367
        plafond_majoration_annee: 2025
        salaire_reference: carriere_entiere
        assiette: tranche_b
        taux_cotisation_retraite: 0.1158
        decote_par_trimestre: 0.01
        surcote_par_trimestre: null
        avantages_non_contributifs: [majoration_enfants, reversion]
        notes: >-
          Taux EFFECTIF moyen de la période, 11,58 %, mesuré sur la série
          annuelle d'OpenFisca-France — 8,24 % en 1981, 12 % en 1988. La fiche
          portait 8 % sur toute la période 1947-1988, soit le taux contractuel
          d'origine appliqué à quarante-deux ans : les huit dernières années y
          étaient sous-cotisées d'un tiers.

      - debut: 1989
        fin: 1993
        type_calcul: points
        age_ouverture: 60
        age_taux_plein: 65
        duree_requise_trimestres: null
        taux_plein: 1.0
        abattement_points: agirc_arrco
        plafond_majoration_enfants: 2367
        plafond_majoration_annee: 2025
        salaire_reference: carriere_entiere
        assiette: tranche_b
        taux_cotisation_retraite: 0.14
        decote_par_trimestre: 0.01
        points_minimum_annuels: 120
        avantages_non_contributifs: [majoration_enfants, reversion, garantie_minimale_points]
        notes: >-
          GARANTIE MINIMALE DE POINTS, accord du 9 février 1988 : tout cadre
          cotisant à l'Agirc acquiert au moins 120 points par an, même quand sa
          tranche B est nulle — c'est-à-dire même quand son salaire ne dépasse
          pas le plafond de la Sécurité sociale. C'est un droit GRATUIT, sans
          contrepartie de cotisation proportionnelle, et le modèle le déclarait
          sans jamais le servir : un cadre payé sous le plafond n'acquérait
          aucun point à l'Agirc, quand le droit lui en donnait 120 par an.
          La garantie disparaît avec la fusion Agirc-Arrco du 1er janvier 2019.
      - debut: 1994
        fin: 2018
        type_calcul: points
        age_ouverture: 60
        age_ouverture_par_generation: true
        age_taux_plein: 65
        duree_requise_trimestres: 160
        taux_plein: 1.0
        abattement_points: agirc_arrco
        plafond_majoration_enfants: 2367
        plafond_majoration_annee: 2025
        salaire_reference: carriere_entiere
        assiette: tranche_b
        taux_cotisation_retraite: 0.1948
        decote_par_trimestre: 0.01
        surcote_par_trimestre: null
        points_minimum_annuels: 120
        avantages_non_contributifs: [majoration_enfants, reversion, garantie_minimale_points]
        notes: >-
          Taux contractuel 16,44 % + taux d'appel 125 % = 20,55 % de cotisation
          effective sur T B/C EN FIN DE PÉRIODE, pour 16,44 % de points acquis.
          L'écart taux d'appel / taux de calcul est une cotisation de solidarité
          sans contrepartie de droits : elle est traitée comme une cotisation
          effective dans le compte notionnel (paramètre `taux_appel_ouvre_droits`).
          La fiche portait ces 20,43 % sur toute la période 1994-2018 ; le taux
          effectif moyen de la période, mesuré sur la série annuelle
          d'OpenFisca-France, est de 19,48 % — 16,25 % en 1994, 20,55 % depuis
          2015. C'est cette moyenne qui est retenue.

  - code: arrco
    nom: Association pour le régime de retraite complémentaire des salariés
    famille: complementaire_prive
    source_id: agirc_arrco_points
    fiabilite: moyenne
    creation: 1961
    fermeture: 2018
    extinction: 2018
    succede_a: [unirs]
    integre_dans: agirc_arrco
    population: >-
      Tous les salariés du privé (non-cadres pour la totalité du salaire,
      cadres pour la tranche sous plafond).
    hors_repartition: false
    periodes:
      - debut: 1961
        fin: 1995
        type_calcul: points
        age_ouverture: 60
        age_taux_plein: 65
        duree_requise_trimestres: null
        taux_plein: 1.0
        abattement_points: agirc_arrco
        plafond_majoration_enfants: 2367
        plafond_majoration_annee: 2025
        salaire_reference: carriere_entiere
        assiette: tranche_1
        taux_cotisation_retraite: 0.04
        decote_par_trimestre: 0.01
        surcote_par_trimestre: null
        avantages_non_contributifs: [majoration_enfants, reversion]
        notes: >-
          Accord du 8 décembre 1961 généralisant la retraite complémentaire.
          Taux contractuel minimal de 4 % monté par étapes.
      - debut: 1996
        fin: 2018
        type_calcul: points
        age_ouverture: 60
        age_ouverture_par_generation: true
        age_taux_plein: 65
        duree_requise_trimestres: 160
        taux_plein: 1.0
        abattement_points: agirc_arrco
        plafond_majoration_enfants: 2367
        plafond_majoration_annee: 2025
        salaire_reference: carriere_entiere
        assiette: tranche_1
        taux_cotisation_retraite: 0.0750
        decote_par_trimestre: 0.01
        surcote_par_trimestre: null
        avantages_non_contributifs: [majoration_enfants, reversion]
        notes: >-
          Taux contractuel 6 % sur T1 et 16 % sur T2, taux d'appel 125 %.
          Taux effectif moyen de la période d'après OpenFisca-France : 7,42 % ;
          la fiche porte 7,50 %, valeur de fin de période.

      - debut: 1996
        fin: 2018
        type_calcul: points
        age_ouverture: 60
        age_ouverture_par_generation: true
        age_taux_plein: 65
        duree_requise_trimestres: 160
        taux_plein: 1.0
        abattement_points: agirc_arrco
        plafond_majoration_enfants: 2367
        plafond_majoration_annee: 2025
        salaire_reference: carriere_entiere
        assiette: tranche_2_arrco
        taux_cotisation_retraite: 0.1950
        decote_par_trimestre: 0.01
        surcote_par_trimestre: null
        avantages_non_contributifs: [majoration_enfants, reversion]
        notes: >-
          TRANCHE 2 DE L'ARRCO, que la fiche ignorait. Tous les salariés du
          privé cotisent à l'Arrco sur la tranche 1, mais SEULS LES NON-CADRES
          cotisent sur la tranche 2 — la part de salaire comprise entre un et
          TROIS plafonds de la Sécurité sociale, et non huit comme dans le
          régime unifié d'après 2019. La fiche n'ayant que la tranche 1, un
          non-cadre payé au-dessus du plafond n'acquérait aucun droit
          complémentaire sur ce qui dépassait, alors que son régime y prélevait
          près d'un cinquième.
          Taux effectifs d'OpenFisca-France : 17,50 % en 1997, 20,25 % depuis
          2015, soit 19,50 % en moyenne sur la période où la tranche existe.
          Avant 1997, l'Arrco ne cotisait pas au-dessus du plafond : la période
          1961-1995 n'a donc pas de tranche 2.

  - code: agirc_arrco
    nom: Régime unifié Agirc-Arrco
    famille: complementaire_prive
    source_id: agirc_arrco_points
    fiabilite: haute
    creation: 2019
    fermeture: null
    extinction: null
    succede_a: [agirc, arrco]
    integre_dans: null
    population: Ensemble des salariés du secteur privé.
    hors_repartition: false
    periodes:
      - debut: 2019
        fin: null
        type_calcul: points
        age_ouverture: 62
        age_ouverture_par_generation: true
        age_taux_plein: 67
        duree_requise_trimestres: 172
        taux_plein: 1.0
        abattement_points: agirc_arrco
        plafond_majoration_enfants: 2367
        plafond_majoration_annee: 2025
        salaire_reference: carriere_entiere
        assiette: tranche_1
        taux_cotisation_retraite: 0.0787
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [majoration_enfants, reversion, coefficient_solidarite]
        notes: >-
          Accord national interprofessionnel du 17 novembre 2017.
          L'abattement n'est pas la décote du régime de base : le régime
          publie ses propres COEFFICIENTS D'ANTICIPATION, en deux tables — l'une
          indexée sur les trimestres manquants (0,99 à 0,78 de un à vingt),
          l'autre sur l'âge (1 à 0,43 pour dix ans d'anticipation) — et retient
          la plus avantageuse pour l'assuré. La majoration pour enfants est
          quant à elle PLAFONNÉE en euros : 2 367 € par an pour les pensions
          servies depuis le 1er novembre 2025, revalorisés comme la valeur de
          service du point, et opposables aux seuls assurés nés à compter du
          2 août 1951.
          Tranche 1 (0 -> 1 PASS) : taux d'appel 7,87 %, taux de calcul des
          points 6,20 %. Tranche 2 (1 -> 8 PASS) : taux d'appel 21,59 %,
          taux de calcul 17,00 % (voir `tranche_2` ci-dessous).
          Le coefficient de solidarité (malus 10 % pendant 3 ans) et le
          coefficient majorant sont des dispositifs d'incitation d'âge :
          ils sont remplacés par le coefficient de conversion actuariel dans
          les scénarios notionnels.
      - debut: 2019
        fin: null
        type_calcul: points
        age_ouverture: 62
        age_ouverture_par_generation: true
        age_taux_plein: 67
        duree_requise_trimestres: 172
        taux_plein: 1.0
        abattement_points: agirc_arrco
        plafond_majoration_enfants: 2367
        plafond_majoration_annee: 2025
        salaire_reference: carriere_entiere
        assiette: tranche_2
        taux_cotisation_retraite: 0.2159
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [majoration_enfants, reversion, coefficient_solidarite]
        notes: Tranche 2, de 1 à 8 plafonds de la Sécurité sociale.

