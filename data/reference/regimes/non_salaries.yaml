    hors_repartition: false
    periodes:
      - debut: 1952
        fin: 2002
        type_calcul: mixte
        age_ouverture: 65
        age_taux_plein: 65
        duree_requise_trimestres: 150
        taux_plein: 1.0
        salaire_reference: carriere_entiere
        assiette: forfaitaire
        taux_cotisation_retraite: 0.085
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [minimum_vieillesse, reversion]
        notes: >-
          Loi du 10 juillet 1952 créant l'assurance vieillesse agricole (AVA).
          Retraite en deux parts : forfaitaire (indépendante du revenu) et
          proportionnelle en points. La part forfaitaire est un droit quasi
          non contributif : elle disparaît dans les scénarios notionnels.
      - debut: 2003
        fin: null
        type_calcul: mixte
        age_ouverture: 64
        age_taux_plein: 67
        duree_requise_trimestres: 172
        taux_plein: 1.0
        salaire_reference: carriere_entiere
        assiette: plafonnee
        taux_cotisation_retraite: 0.1737
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: 0.0125
        avantages_non_contributifs:
          [minimum_vieillesse, pension_majoree_reference, reversion]
        notes: >-
          Loi du 4 mars 2002 créant la retraite complémentaire obligatoire (RCO)
          des non-salariés agricoles, en points. Garantie « 85 % du SMIC » :
          droit non contributif, neutralisé dans les scénarios notionnels.
          La valeur de service du point de RCO est désormais sourcée et
          certifiée de 2005 à 2024, depuis l'article D. 732-166 du code rural
          (base LEGI de la DILA) : elle est rangée sous le code msa_rco, que le
          catalogue ne connaît pas, parce que cette fiche agrège les deux
          étages et que tout verser dans le complémentaire ferait disparaître la
          base. Le régime reste donc calculé au rendement instantané, faute des
          deux pièces qui manquent encore. La première est la valeur d'ACHAT du
          point de RCO : contrairement à ce qui a d'abord été écrit ici, elle
          existe — l'article L. 732-60 la mentionne expressément — mais elle est
          fixée par arrêté triennal, qui ne modifie pas le code. La seconde est
          le barème du régime de base, dont la retraite proportionnelle attribue
          de 23 à 113 points par tranche de revenu, sans série publiée ; la
          valeur de son point n'est entrée dans le code qu'en 2025 (R. 732-66,
          4,589 € au 1er janvier 2025 ; le COR donne 4,264 € pour 2023). S'y
          ajoutent des points gratuits — 66 par an aux conjoints et aides
          familiaux pour les périodes antérieures à 2011, dans la limite de
          17 années. Voir docs/limites.md §1.
