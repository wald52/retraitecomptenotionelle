  - code: cnavpl
    nom: Régime de base des professions libérales (CNAVPL)
    famille: liberal
    source_id: cnavpl_parametres
    fiabilite: moyenne
    creation: 1949
    fermeture: null
    extinction: null
    succede_a: []
    integre_dans: null
    population: >-
      Professions libérales réparties en dix sections professionnelles
      (CARMF, CARPIMKO, CARCDSF, CAVP, CAVEC, CAVAMAC, CAVOM, CIPAV, CRN, CAVA).
    hors_repartition: false
    periodes:
      - debut: 1949
        fin: 2003
        type_calcul: points
        age_ouverture: 65
        age_taux_plein: 65
        duree_requise_trimestres: null
        taux_plein: 1.0
        salaire_reference: carriere_entiere
        assiette: forfaitaire
        taux_cotisation_retraite: 0.085
        decote_par_trimestre: null
        surcote_par_trimestre: null
        avantages_non_contributifs: [minimum_vieillesse, reversion]
        notes: >-
          Régime de base en points assis sur des CLASSES DE COTISATION
          forfaitaires jusqu'à la réforme de 2004 : la reconstitution du compte
          notionnel exige la grille des classes par année et par section
          (non encore intégrée — voir data/reference/regimes/TODO_liberaux.md).
      - debut: 2004
        fin: null
        type_calcul: points
        age_ouverture: 62
        age_taux_plein: 67
        duree_requise_trimestres: 172
        taux_plein: 1.0
        salaire_reference: carriere_entiere
        assiette: plafonnee
        taux_cotisation_retraite: 0.1015
        decote_par_trimestre: 0.0125
        surcote_par_trimestre: 0.0075
        avantages_non_contributifs: [minimum_vieillesse, reversion]
        notes: >-
          Réforme du 21 août 2003 : régime de base unique en points,
          proportionnel au revenu, sur deux tranches. Les taux de 8,23 % et de
          1,87 % sont ceux que la CNAVPL publie dans ses recueils statistiques,
          et sont versés certifiés dans valeurs_point.csv avec la valeur de
          service du point (0,5731 € en 2021, 0,6540 € en 2025). Attention, ils
          ne valent que depuis 2015 : le plafond de la première tranche est
          alors passé de 0,85 à 1 PASS, celui de la seconde de 0,85-5 à 0-5
          PASS, et le nombre maximal de points de 450 à 525 sur T1 comme de 100
          à 25 sur T2. La période n'est pas encore scindée à cette date, et le
          taux agrégé de 10,15 % vaut pour toute la période 2004-. Le
          plafonnement en points — 525 et 25 depuis 2015, source recueil
          statistique — est ce qui manque au moteur pour convertir une
          cotisation en droits ; il se lit dans un tableau que
          scripts/fetch/cnavpl_recueils.py ne relit pas de façon sûre.
          Chaque section gère en outre un régime complémentaire obligatoire aux
          paramètres propres.

